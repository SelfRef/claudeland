name: Bug report
description: Something in Vibecheck does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, email addresses, organization IDs, or raw API responses.
  - type: input
    id: version
    attributes:
      label: Vibecheck version
      placeholder: '0.4.0'
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version and distribution
      placeholder: '51.1, Fedora 45'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: 'From `journalctl --user -o cat /usr/bin/gnome-shell`, with secrets removed.'
      render: text
